<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TT247 – Hệ thống Quản lý và Tra cứu Lịch trực Giám định Toàn quốc</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --tt-blue-primary: #2563eb;
      --tt-blue-dark: #1e3a8a;
      --tt-blue-light: #eff6ff;
      --tt-accent: #f59e0b;
      --tt-danger: #ef4444;
      --tt-success: #10b981;
      --tt-surface: #ffffff;
      --tt-bg: #f8fafc;
      --tt-text-main: #0f172a;
      --tt-text-muted: #64748b;
      --sidebar-width: 280px;
    }

    body {
      background-color: var(--tt-bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--tt-text-main);
      display: flex;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* Sidebar Layout */
    .sidebar {
      width: var(--sidebar-width);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.02);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1040;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease;
    }

    /* Navbar / Brand */
    .sidebar-brand {
      padding: 24px;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--tt-blue-primary);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    /* Navigation Links */
    .sidebar-nav {
      padding: 24px 16px;
      flex: 1;
      overflow-y: auto;
    }
    
    .nav-link {
      font-weight: 600;
      color: var(--tt-text-muted) !important;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    
    .nav-link:hover {
      background-color: var(--tt-blue-light);
      color: var(--tt-blue-primary) !important;
      transform: translateX(4px);
    }
    
    .nav-link.active {
      background: linear-gradient(135deg, var(--tt-blue-primary), #3b82f6);
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* Sidebar Footer (User Area) */
    .sidebar-footer {
      padding: 24px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    /* Mobile Header */
    .mobile-header {
      display: none;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 1030;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .mobile-header {
        display: flex;
      }
      /* Overlay for mobile sidebar */
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(4px);
        z-index: 1035;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .sidebar-overlay.show {
        display: block;
        opacity: 1;
      }
    }

    /* Premium UI Components */
    .card {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.04);
      border-radius: 20px;
      overflow: hidden;
    }
    
    .card-lookup-header {
      background: linear-gradient(135deg, var(--tt-blue-primary), #60a5fa);
      color: #ffffff;
      padding: 20px 24px;
      border-bottom: none;
    }

    .on-call-card {
      border-left: 6px solid var(--tt-blue-primary);
    }

    .btn {
      border-radius: 12px;
      font-weight: 600;
      padding: 10px 20px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--tt-blue-primary), #3b82f6);
      border: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      color: #fff;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
      color: #fff;
    }

    .btn-tel {
      background: linear-gradient(135deg, var(--tt-success), #34d399);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .btn-tel:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
      color: #ffffff;
    }

    .form-control, .form-select {
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 12px 16px;
      background-color: var(--tt-bg);
      transition: all 0.2s ease;
    }
    .form-control:focus, .form-select:focus {
      background-color: #ffffff;
      border-color: var(--tt-blue-primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    /* Badges */
    .badge {
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 600;
    }

    .toast-container-custom {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 1100;
    }
  </style>
</head>
<body>

  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR (LEFT) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div style="background: linear-gradient(135deg, var(--tt-blue-primary), #60a5fa); padding: 8px; border-radius: 12px; color: white; display: flex;">
        <i data-lucide="shield-alert"></i>
      </div>
      TT247 PRO
    </div>

    <div class="sidebar-nav">
      <div id="nav-links">
        <a class="nav-link active" href="#lookup"><i data-lucide="search"></i> Tra Cứu Trực</a>
        <a class="nav-link" href="#rules"><i data-lucide="sliders"></i> Quy Tắc Lịch Trực</a>
        <a class="nav-link" href="#overrides"><i data-lucide="repeat"></i> Đổi Ca & Nghỉ Phép</a>
        <a class="nav-link" href="#dispatch-history"><i data-lucide="history"></i> Nhật Ký Điều Phối</a>
        <a class="nav-link" href="#seeder"><i data-lucide="database"></i> Khởi Tạo Dữ Liệu</a>

      </button>

  <!-- MAIN CONTENT (RIGHT) -->
  <main class="main-content">
    
    <!-- Mobile Header -->
    <header class="mobile-header">
      <div class="fw-bold text-primary d-flex align-items-center gap-2">
        <i data-lucide="shield-alert"></i> TT247 PRO
      </div>
      <button class="btn btn-light rounded-circle p-2" id="btnMobileToggle">
        <i data-lucide="menu"></i>
      </button>
    </header>

    <!-- Page Content -->
    <div class="container-fluid py-4 px-md-5">
      <div id="alert-container"></div>
      <div id="app-viewport">
        <!-- Vùng render của SPA Router -->
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <div class="mt-3 fw-bold text-muted">Đang tải trải nghiệm Premium...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL CẤU HÌNH FIREBASE TẠI CHỖ -->
  <div class="modal fade" id="firebaseConfigModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title d-flex align-items-center gap-2">
            <i data-lucide="key"></i> Cấu Hình Firebase Web SDK
          </h5>

            Dán đối tượng cấu hình Firebase từ Firebase Console của bạn. Dữ liệu sẽ được lưu an toàn vào <code>localStorage</code> của trình duyệt.
          </p>
          <div class="mb-3">
            <label class="form-label fw-bold">JSON Firebase Config</label>
            <textarea class="form-control font-monospace" id="txt-firebase-json" rows="8" placeholder='{
  "apiKey": "AIzaSy...",
  "authDomain": "your-app.firebaseapp.com",
  "projectId": "your-app",

}'></textarea>

  <!-- TOAST THÔNG BÁO -->
  <div class="toast-container toast-container-custom" id="toast-container"></div>

    <!-- UI SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnToggle = document.getElementById('btnMobileToggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const navLinks = document.querySelectorAll('.nav-link');

      function toggleSidebar() {
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
      }

      if (btnToggle) btnToggle.addEventListener('click', toggleSidebar);
      if (overlay) overlay.addEventListener('click', toggleSidebar);
      
      // Close sidebar on mobile when a link is clicked
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth < 992) toggleSidebar();
        });
      });
    });
  </script>

  <!-- FIREBASE VÀ TOÀN BỘ LOGIC ỨNG DỤNG (ES MODULES) -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, 
      query, where, orderBy, limit, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ==========================================
    // 1. CẤU HÌNH FIREBASE KHỞI CHẠY
    // ==========================================
    const DEFAULT_CONFIG = {
      apiKey: "AIzaSyDFbVVd757x_ov1gnbl2gn6X431hNsYavQ",
      authDomain: "tt247-dispatch-system.firebaseapp.com",
      projectId: "tt247-dispatch-system",
      storageBucket: "tt247-dispatch-system.firebasestorage.app",
      messagingSenderId: "820899281104",
      appId: "1:820899281104:web:8145be26ddfb6a16c546d5"
    };

    let activeConfig = DEFAULT_CONFIG;
    const stored = localStorage.getItem("tt247_firebase_config");
    if (stored) {
      try { activeConfig = JSON.parse(stored); } catch (e) { console.error(e); }
    }

    let app, auth, db;
    let isFirebaseReady = false;

    try {
      app = initializeApp(activeConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      isFirebaseReady = true;
    } catch (err) {
      console.warn("Chưa cấu hình Firebase hoặc cấu hình không hợp lệ:", err);
    }

    // ==========================================
    // 2. HELPER TOAST VÀ THÔNG BÁO
    // ==========================================
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toastEl = document.createElement('div');
      toastEl.className = `toast align-items-center text-white bg-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'primary'} border-0 show mb-2`;
      toastEl.setAttribute('role', 'alert');
      toastEl.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      container.appendChild(toastEl);
      setTimeout(() => { toastEl.remove(); }, 4000);
    };

    // ==========================================
    // 3. AUTH SERVICE & PHÂN QUYỀN RBAC
    // ==========================================
    const authService = {
      currentUser: null,
      userProfile: null,

      async init() {
        if (!isFirebaseReady) return;
        return new Promise((resolve) => {
          onAuthStateChanged(auth, async (user) => {
            this.currentUser = user;
            if (user) {
              await this.loadProfile(user.uid);
            } else {
              this.userProfile = null;
            }
            this.updateUI();
            resolve(this.userProfile);
          });
        });
      },

      async loadProfile(uid) {
        try {
          const docSnap = await getDoc(doc(db, "users", uid));
          if (docSnap.exists()) {
            this.userProfile = { uid, ...docSnap.data() };
          } else {
            // Mặc định cho tài khoản mới đăng nhập lần đầu
            this.userProfile = {
              uid,
              email: this.currentUser.email,
              role: 'tt247_operator',
              assignedZoneIds: ['ZONE_HN_01']
            };
          }
        } catch (e) {
          console.error("Lỗi đọc hồ sơ user:", e);
        }
      },

      async login(email, password) {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await this.loadProfile(cred.user.uid);
        this.updateUI();
        return this.userProfile;
      },

      async logout() {
        await signOut(auth);
        this.currentUser = null;
        this.userProfile = null;
        this.updateUI();
      },

      hasRole(roles) {
        if (!this.userProfile) return false;
        if (this.userProfile.role === 'sys_admin') return true;
        return roles.includes(this.userProfile.role);
      },

      updateUI() {
        const container = document.getElementById('user-badge-container');
        if (this.currentUser) {
          container.innerHTML = `
            <div class="dropdown">
              <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
                <i data-lucide="user-check" class="me-1"></i> ${this.currentUser.email.split('@')[0]} (${this.userProfile?.role || 'user'})
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><h6 class="dropdown-header">Vai trò: ${this.userProfile?.role}</h6></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item text-danger" id="btn-do-logout"><i data-lucide="log-out" class="me-1"></i> Đăng xuất</button></li>
              </ul>
            </div>
          `;
          document.getElementById('btn-do-logout')?.addEventListener('click', () => this.logout());
        } else {
          container.innerHTML = `
            <a href="#login" class="btn btn-warning btn-sm fw-bold">
              <i data-lucide="log-in" class="me-1"></i> Đăng nhập
            </a>
          `;
        }
        lucide.createIcons();
      }
    };

    // ==========================================
    // 4. DATABASE SERVICE (FIRESTORE)
    // ==========================================
    const dbService = {
      async getAdministrativeAreas(parentCode = 'ROOT') {
        const q = query(collection(db, "administrativeAreas"), where("parentCode", "==", parentCode));
        const snap = await getDocs(q);
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
      },

      async getZoneByAreaCoverage(taskType, provinceCode, wardCode) {
        const covRef = collection(db, "zoneCoverage");
        
        // 1. Tìm cấu hình chi tiết theo Phường/Xã trước
        if (wardCode && wardCode !== '*') {
          const qWard = query(
            covRef, 
            where("provinceCode", "==", provinceCode), 
            where("wardCode", "==", wardCode),
            where("isActive", "==", true)
          );
          const snapWard = await getDocs(qWard);
          const matched = snapWard.docs.find(d => {
            const t = d.data().taskType;
            return t === taskType || t === 'both';
          });
          if (matched) {
            const zoneDoc = await getDoc(doc(db, "zones", matched.data().zoneId));
            return zoneDoc.exists() ? { zoneId: zoneDoc.id, ...zoneDoc.data() } : null;
          }
        }

        // 2. Tìm cấu hình bao trùm toàn Tỉnh/Thành
        const qProv = query(
          covRef,
          where("provinceCode", "==", provinceCode),
          where("wardCode", "==", "*"),
          where("isActive", "==", true)
        );
        const snapProv = await getDocs(qProv);
        const matchedProv = snapProv.docs.find(d => {
          const t = d.data().taskType;
          return t === taskType || t === 'both';
        });

        if (matchedProv) {
          const zoneDoc = await getDoc(doc(db, "zones", matchedProv.data().zoneId));
          return zoneDoc.exists() ? { zoneId: zoneDoc.id, ...zoneDoc.data() } : null;
        }

        return null;
      },

      async searchGarages(term, provinceCode = null) {
        const snap = await getDocs(collection(db, "garages"));
        let list = snap.docs.map(d => ({ garageId: d.id, ...d.data() }));
        if (provinceCode) list = list.filter(g => g.provinceCode === provinceCode);
        if (term) {
          const lower = term.toLowerCase();
          list = list.filter(g => (g.name || '').toLowerCase().includes(lower) || (g.code || '').toLowerCase().includes(lower));
        }
        return list;
      },

      async getGarageAssignment(garageId) {
        const snap = await getDoc(doc(db, "garageAssignments", garageId));
        return snap.exists() ? snap.data() : null;
      },

      async getInspectorById(inspectorId) {
        if (!inspectorId) return null;
        const snap = await getDoc(doc(db, "inspectors", inspectorId));
        return snap.exists() ? { inspectorId: snap.id, ...snap.data() } : null;
      },

      async getInspectorsByZone(zoneId) {
        const q = query(collection(db, "inspectors"), where("zoneId", "==", zoneId), where("isActive", "==", true));
        const snap = await getDocs(q);
        return snap.docs.map(d => ({ inspectorId: d.id, ...d.data() }));
      },

      async getActiveRulesForZone(zoneId, taskType, dateStr) {
        const q = query(
          collection(db, "scheduleRules"),
          where("zoneId", "==", zoneId),
          where("status", "==", "published"),
          where("effectiveFrom", "<=", dateStr)
        );
        const snap = await getDocs(q);
        return snap.docs
          .map(d => ({ ruleId: d.id, ...d.data() }))
          .filter(r => (r.taskType === taskType || r.taskType === 'both') && (!r.effectiveTo || r.effectiveTo >= dateStr));
      },

      async findActiveOverride({ originalInspectorId, dateStr, timeStr, taskType, zoneId }) {
        const q = query(
          collection(db, "scheduleOverrides"),
          where("zoneId", "==", zoneId),
          where("originalInspectorId", "==", originalInspectorId),
          where("dateStr", "==", dateStr),
          where("status", "==", "approved")
        );
        const snap = await getDocs(q);
        return snap.docs
          .map(d => ({ overrideId: d.id, ...d.data() }))
          .find(o => (!o.taskType || o.taskType === taskType) && 
                     (!o.startTime || (timeStr >= o.startTime && timeStr <= o.endTime)));
      },

      async checkInspectorOnLeave(inspectorId, dateStr, timeStr) {
        const q = query(
          collection(db, "leaves"),
          where("inspectorId", "==", inspectorId),
          where("status", "==", "approved"),
          where("fromDate", "<=", dateStr),
          where("toDate", ">=", dateStr)
        );
        const snap = await getDocs(q);
        return !snap.empty;
      },

      async createDispatchRecord(data) {
        return await addDoc(collection(db, "dispatchRecords"), {
          ...data,
          createdAt: serverTimestamp()
        });
      },

      async getDispatchHistory(limitCount = 20) {
        const q = query(collection(db, "dispatchRecords"), orderBy("createdAt", "desc"), limit(limitCount));
        const snap = await getDocs(q);
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }
    };

    // ==========================================
    // 5. SCHEDULE RESOLUTION ENGINE (THUẬT TOÁN 8 BƯỚC)
    // ==========================================
    class ScheduleEngine {
      constructor(dbInstance) {
        this.db = dbInstance;
      }

      async resolveOnCall(params) {
        const { taskType, provinceCode, wardCode, garageId, searchDateTime } = params;
        const res = {
          success: false,
          zone: null,
          primary: null,
          backup: null,
          zoneLead: null,
          source: null,
          shiftTime: "Cả ngày",
          warnings: [],
          error: null
        };

        try {
          // BƯỚC 1: Chuẩn hóa thời gian (UTC+7)
          const dateStr = this.formatDate(searchDateTime);
          const timeStr = this.formatTime(searchDateTime);

          // BƯỚC 2: Tìm Zone quản lý theo phạm vi địa bàn
          const zone = await this.db.getZoneByAreaCoverage(taskType, provinceCode, wardCode);
          if (!zone) {
            res.error = "NO_ZONE_COVERAGE";
            res.warnings.push("Địa bàn này chưa được phân công cho Zone nào quản lý.");
            return res;
          }
          res.zone = zone;
          res.zoneLead = { name: zone.leadName, phone: zone.leadPhone, id: zone.leadInspectorId };

          // BƯỚC 3: Nếu là Giám định chi tiết có chọn Gara -> Kiểm tra GĐV cố định Gara
          if (taskType === 'detailed' && garageId) {
            const assignment = await this.db.getGarageAssignment(garageId);
            if (assignment && assignment.isActive) {
              const basePrimary = await this.db.getInspectorById(assignment.primaryInspectorId);
              const baseBackup = assignment.backupInspectorId ? await this.db.getInspectorById(assignment.backupInspectorId) : null;
              
              // Kiểm tra xem GĐV cố định có nghỉ phép hoặc đổi ca không
              const evaluatedPrimary = await this.checkLeaveAndOverride(basePrimary, dateStr, timeStr, taskType, zone.zoneId);

              res.success = true;
              res.source = evaluatedPrimary.isOverridden ? 'TRỰC THAY (GARA CỐ ĐỊNH)' : 'GARA CỐ ĐỊNH';
              res.primary = evaluatedPrimary.inspector;
              res.backup = baseBackup;
              res.warnings.push(...evaluatedPrimary.warnings);
              return res;
            }
          }

          // BƯỚC 4: Truy xuất Quy tắc lịch trực (Schedule Rules) của Zone
          const rules = await this.db.getActiveRulesForZone(zone.zoneId, taskType, dateStr);
          if (!rules || rules.length === 0) {
            res.error = "NO_SCHEDULE_RULE";
            res.warnings.push(`Zone ${zone.name} chưa công bố quy tắc trực cho ngày ${dateStr}.`);
            return res;
          }

          // BƯỚC 5: Lọc quy tắc phù hợp nhất theo mức ưu tiên và khung giờ
          const matchedRule = this.selectBestMatchingRule(rules, timeStr, wardCode);
          if (!matchedRule) {
            res.error = "NO_MATCHING_RULE";
            res.warnings.push("Không có ca trực nào bao quát khung giờ tra cứu.");
            return res;
          }

          // BƯỚC 6: Tính toán nhân sự trực theo loại mô hình (Chẵn/lẻ, Chu kỳ, Thứ)
          const roster = this.evaluateRoster(matchedRule, dateStr);
          if (!roster || !roster.primaryId) {
            res.error = "EMPTY_ROSTER";
            res.warnings.push("Quy tắc trực tồn tại nhưng chưa cấu hình nhân sự.");
            return res;
          }

          const rawPrimary = await this.db.getInspectorById(roster.primaryId);
          const rawBackup = roster.backupId ? await this.db.getInspectorById(roster.backupId) : null;

          // BƯỚC 7: Áp dụng Nghỉ phép & Phân công trực thay (Overrides & Leaves)
          const finalPrimary = await this.checkLeaveAndOverride(rawPrimary, dateStr, timeStr, taskType, zone.zoneId);
          let finalBackup = rawBackup;
          if (rawBackup) {
            const backupCheck = await this.checkLeaveAndOverride(rawBackup, dateStr, timeStr, taskType, zone.zoneId);
            finalBackup = backupCheck.inspector;
          }

          // BƯỚC 8: Trả về kết quả
          res.success = true;
          res.source = finalPrimary.isOverridden ? 'TRỰC THAY' : 'LỊCH TRỰC ZONE';
          res.primary = finalPrimary.inspector;
          res.backup = finalBackup;
          res.shiftTime = `${matchedRule.timeSlot.start} - ${matchedRule.timeSlot.end}${matchedRule.timeSlot.isOvernight ? ' (Qua đêm)' : ''}`;
          res.warnings.push(...finalPrimary.warnings);

          return res;

        } catch (e) {
          console.error("Lỗi ScheduleEngine:", e);
          res.error = "ENGINE_EXCEPTION";
          res.warnings.push(e.message);
          return res;
        }
      }

      async checkLeaveAndOverride(inspector, dateStr, timeStr, taskType, zoneId) {
        const warnings = [];
        if (!inspector) return { inspector: null, isOverridden: false, warnings: ["Không tìm thấy hồ sơ GĐV."] };

        // 1. Kiểm tra trực thay
        const override = await this.db.findActiveOverride({
          originalInspectorId: inspector.inspectorId,
          dateStr,
          timeStr,
          taskType,
          zoneId
        });

        if (override) {
          const rep = await this.db.getInspectorById(override.replacementInspectorId);
          warnings.push(`GĐV ${inspector.fullName} đã bàn giao trực cho ${rep?.fullName || 'GĐV khác'} (Lý do: ${override.reason}).`);
          return { inspector: rep, isOverridden: true, warnings };
        }

        // 2. Kiểm tra nghỉ phép
        const onLeave = await this.db.checkInspectorOnLeave(inspector.inspectorId, dateStr, timeStr);
        if (onLeave) {
          warnings.push(`CẢNH BÁO: GĐV ${inspector.fullName} đang NGHỈ PHÉP nhưng chưa có người nhận trực thay!`);
        }

        return { inspector, isOverridden: false, warnings };
      }

      evaluateRoster(rule, dateStr) {
        const { ruleType, rosterConfig, cycleAnchorDate, cycleLength } = rule;
        const targetDate = new Date(dateStr + "T00:00:00");
        const dayOfMonth = targetDate.getDate();

        if (ruleType === 'even_odd') {
          const isOdd = dayOfMonth % 2 !== 0;
          return isOdd ? rosterConfig.odd : rosterConfig.even;
        }

        if (ruleType === 'continuous_cycle') {
          const anchor = new Date((cycleAnchorDate || dateStr) + "T00:00:00");
          const diffDays = Math.floor((targetDate.getTime() - anchor.getTime()) / (86400000));
          const idx = ((diffDays % cycleLength) + cycleLength) % cycleLength;
          return rosterConfig.cycles ? rosterConfig.cycles[idx] : rosterConfig.odd;
        }

        if (ruleType === 'day_of_week') {
          const dow = targetDate.getDay();
          return rosterConfig.weekly ? rosterConfig.weekly[dow] : rosterConfig.odd;
        }

        return rosterConfig.default || rosterConfig.odd;
      }

      selectBestMatchingRule(rules, timeStr, wardCode) {
        const sorted = [...rules].sort((a, b) => (b.priority || 0) - (a.priority || 0));
        for (const r of sorted) {
          if (this.isWithinTimeSlot(timeStr, r.timeSlot)) {
            if (r.wardCode && r.wardCode !== '*' && r.wardCode !== wardCode) continue;
            return r;
          }
        }
        return null;
      }

      isWithinTimeSlot(timeStr, slot) {
        if (!slot) return true;
        const { start, end, isOvernight } = slot;
        if (!isOvernight) {
          return timeStr >= start && timeStr <= end;
        } else {
          return timeStr >= start || timeStr <= end;
        }
      }

      formatDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      formatTime(d) {
        const h = String(d.getHours()).padStart(2, '0');
        const m = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
      }
    }

                      <th>Ghi chú</th>
                    </tr>
                  </thead>
                  <tbody id="tbl-dispatch-body">
                    <tr><td colspan="7" class="text-center py-4"><span class="spinner-border spinner-border-sm"></span> Đang tải nhật ký...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();

        try {
          const list = await dbService.getDispatchHistory(30);
          const tbody = container.querySelector('#tbl-dispatch-body');
          if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Chưa có bản ghi điều phối nào.</td></tr>`;
            return;
          }
          tbody.innerHTML = list.map(item => {
            const timeStr = item.createdAt?.toDate ? item.createdAt.toDate().toLocaleString('vi-VN') : 'Vừa xong';
            let badgeClass = 'bg-success';
            let statusText = 'Đã kết nối';
            if (item.callStatus === 'busy') { badgeClass = 'bg-warning text-dark'; statusText = 'Bận'; }
            if (item.callStatus === 'unreachable') { badgeClass = 'bg-danger'; statusText = 'Không nghe'; }

            return `
              <tr>
                <td class="small">${timeStr}</td>
                <td><strong class="text-primary">${item.caseCode}</strong></td>
                <td><a href="tel:${item.customerPhone}">${item.customerPhone}</a></td>
                <td><strong>${item.inspectorName || item.assignedInspectorId}</strong></td>
                <td><span class="badge bg-secondary">${item.zoneName || item.assignedZoneId}</span></td>
                <td><span class="badge ${badgeClass}">${statusText}</span></td>
                <td class="small text-muted">${item.notes || ''}</td>
              </tr>
            `;
          }).join('');
        } catch (err) {
          console.error(err);
        }
      },

                    <label class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow">
                    ĐĂNG NHẬP
                  </button>
                </form>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();

        container.querySelector('#form-do-login').addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = container.querySelector('#login-email').value;
          const pass = container.querySelector('#login-password').value;
          try {
            await authService.login(email, pass);
            showToast("Đăng nhập thành công!", "success");
            window.location.hash = "#lookup";
          } catch (err) {
            alert("Đăng nhập thất bại: " + err.message);
          }
        });
      }
    };

    // ==========================================
    // 7. CLIENT-SIDE HASH ROUTER
    // ==========================================
    class AppRouter {
      constructor() {
        this.viewport = document.getElementById('app-viewport');
      }

      async handleRoute() {
        const hash = window.location.hash || '#lookup';

        // Cập nhật trạng thái active trên navbar
        document.querySelectorAll('#nav-links .nav-link').forEach(link => {
          if (link.getAttribute('href') === hash) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });

        // Báo lỗi nếu Firebase chưa cấu hình
        if (!isFirebaseReady && hash !== '#seeder') {
          this.viewport.innerHTML = `
            <div class="card p-4 mx-auto text-center" style="max-width: 600px;">
              <i data-lucide="database-zap" class="text-warning mx-auto mb-2" style="width: 48px; height: 48px;"></i>
              <h4 class="fw-bold">Chưa kết nối Firebase Database</h4>
              <p class="text-muted">Vui lòng bấm nút <strong>"Cấu hình kết nối"</strong> ở góc trên bên phải để nhập Firebase Config, sau đó bấm lưu để sử dụng ứng dụng.</p>
              <div>
                <button class="btn btn-primary" onclick="document.getElementById('btn-config-firebase').click()">
                  Nhập Firebase Config Ngay
                </button>
              </div>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        switch (hash) {
          case '#lookup':
            await views.renderLookup(this.viewport);
            break;
          case '#rules':
            await views.renderRuleBuilder(this.viewport);
            break;
          case '#overrides':
            await views.renderOverrides(this.viewport);
            break;
          case '#dispatch-history':
            await views.renderDispatchHistory(this.viewport);
            break;
          case '#seeder':
            views.renderSeeder(this.viewport);
            break;
          case '#login':
            views.renderLogin(this.viewport);
            break;
          default:
            this.viewport.innerHTML = `<div class="alert alert-warning">Trang không tồn tại (404).</div>`;
        }
      }
    }

    const router = new AppRouter();

    // ==========================================
    // 8. KHỞI TẠO TOÀN HỆ THỐNG
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Gắn sự kiện modal Firebase Config
      const modalEl = document.getElementById('firebaseConfigModal');
      const configModal = new bootstrap.Modal(modalEl);
      document.getElementById('btn-config-firebase').addEventListener('click', () => {
        document.getElementById('txt-firebase-json').value = localStorage.getItem("tt247_firebase_config") || JSON.stringify(DEFAULT_CONFIG, null, 2);
        configModal.show();
      });

      document.getElementById('btn-save-firebase-config').addEventListener('click', () => {
        try {
          const val = document.getElementById('txt-firebase-json').value;
          JSON.parse(val); // kiểm tra cú pháp JSON hợp lệ
          localStorage.setItem("tt247_firebase_config", val);
          location.reload();
        } catch (e) {
          alert("Chuỗi JSON cấu hình Firebase không hợp lệ! Vui lòng kiểm tra lại.");
        }
      });

      // 2. Khởi tạo Auth State
      await authService.init();

      // 3. Khởi tạo Router
      window.addEventListener('hashchange', () => router.handleRoute());
      router.handleRoute();

      lucide.createIcons();
    });
  </script>
</body>
</html>
